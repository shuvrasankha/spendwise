<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://spendwise-ai.spendwise-ai.workers.dev https://integrate.api.nvidia.com https://www.gstatic.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https://*.googleusercontent.com; frame-src https://accounts.google.com https://spendwise-app-f7227.firebaseapp.com;">
  <title>SpendWise - AI Insights</title>
  <link rel="icon" type="image/png" href="assets/images/logo-96.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e">
  <script src="assets/js/theme.js"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/images/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <!-- Fetch the Firebase SDK in parallel instead of one import after another -->
  <link rel="modulepreload" href="assets/js/config/firebase.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/style.css?v=4" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js" crossorigin="anonymous" defer></script>
</head>

<body>

  <div id="page-loader" class="page-loader">
    <div class="coin-scene">
      <div class="coin">
        <div class="coin-face coin-front">
          <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="coinGrad" cx="40%" cy="35%" r="60%">
                <stop offset="0%" stop-color="#FFE066"/>
                <stop offset="50%" stop-color="#FFD700"/>
                <stop offset="100%" stop-color="#B8860B"/>
              </radialGradient>
            </defs>
            <circle cx="60" cy="60" r="58" fill="url(#coinGrad)" stroke="#B8860B" stroke-width="2"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#DAA520" stroke-width="1.5" stroke-dasharray="4 3"/>
            <text x="60" y="72" text-anchor="middle" font-size="42" font-weight="700" fill="#8B6914" font-family="Inter, sans-serif">₹</text>
          </svg>
        </div>
        <div class="coin-face coin-back">
          <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="coinGradBack" cx="60%" cy="35%" r="60%">
                <stop offset="0%" stop-color="#FFE066"/>
                <stop offset="50%" stop-color="#FFD700"/>
                <stop offset="100%" stop-color="#B8860B"/>
              </radialGradient>
            </defs>
            <circle cx="60" cy="60" r="58" fill="url(#coinGradBack)" stroke="#B8860B" stroke-width="2"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#DAA520" stroke-width="1.5" stroke-dasharray="4 3"/>
            <circle cx="60" cy="60" r="22" fill="none" stroke="#8B6914" stroke-width="2"/>
            <text x="60" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#8B6914" font-family="Inter, sans-serif">SW</text>
          </svg>
        </div>
      </div>
    </div>
    <span class="page-loader-text">Loading SpendWise…</span>
  </div>

  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/images/logo-192.png" alt="" class="auth-logo-image" loading="lazy">
        <h1 class="auth-logo-text">SpendWise</h1>
        <p>Track every rupee, effortlessly.</p>
      </div>
      <div class="tab-switcher">
        <button class="tab-btn active" data-action="switchTabLogin">Login</button>
        <button class="tab-btn" data-action="switchTabSignup">Sign Up</button>
      </div>
      <div id="login-form" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <div class="input-icon-wrap"><i data-lucide="mail"></i>
            <input type="email" id="login-email" placeholder="you@example.com" />
          </div>
        </div>
        <div class="form-group">
          <div class="password-label-row">
            <label>Password</label>
            <button type="button" class="btn-forgot" data-action="showForgotPassword">Forgot password?</button>
          </div>
          <div class="input-icon-wrap"><i data-lucide="lock"></i>
            <input type="password" id="login-password" placeholder="••••••••" />
          </div>
        </div>
        <button class="btn-primary" data-action="handleLogin">Login</button>
        <div class="divider"><span>or</span></div>
        <button class="btn-google" data-action="handleGoogleLogin">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </button>
      </div>
      <div id="signup-form" class="auth-form hidden">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-icon-wrap"><i data-lucide="user"></i>
            <input type="text" id="signup-name" placeholder="Your Name" />
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <div class="input-icon-wrap"><i data-lucide="mail"></i>
            <input type="email" id="signup-email" placeholder="you@example.com" />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-icon-wrap"><i data-lucide="lock"></i>
            <input type="password" id="signup-password" placeholder="Min 8 characters, 1 uppercase, 1 lowercase, 1 number, 1 special character" />
          </div>
        </div>
        <button class="btn-primary" data-action="handleSignup">Create Account</button>
        <div class="divider"><span>or</span></div>
        <button class="btn-google" data-action="handleGoogleLogin">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </button>
      </div>
      <div id="auth-error" class="auth-error hidden"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <nav class="navbar">
      <div class="nav-left">
        <a href="index.html" class="nav-logo-link"><img src="assets/images/logo-96.png" alt="" class="nav-logo-image" width="32" height="32"><span class="nav-logo-text">SpendWise</span></a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" data-action="toggleTheme" title="Toggle Theme" id="theme-btn">
          <i id="theme-icon" data-lucide="sun"></i>
        </button>
        <div class="profile-menu" id="profile-menu">
          <div class="user-avatar" id="user-avatar" data-action="toggleProfileMenu">U</div>
          <div class="profile-dropdown hidden" id="profile-dropdown">
            <div class="profile-currency-wrap">
              <label for="currency-select">Currency</label>
              <select id="currency-select" data-change="handleCurrencyChange"></select>
            </div>
            <button class="btn-logout profile-logout-btn" data-action="handleLogout" title="Logout">
              <i data-lucide="log-out"></i><span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </nav>


    <div class="bottom-nav">
      <button class="bottom-nav-btn" data-action="navigateToDashboard" id="bnav-dashboard">
        <i data-lucide="layout-dashboard"></i><span>Home</span>
      </button>
      <button class="bottom-nav-btn" data-action="navigateToExpense" id="bnav-add">
        <i data-lucide="wallet"></i><span>Expense</span>
      </button>
      <button class="bottom-nav-btn" data-action="navigateToIncome" id="bnav-income">
        <i data-lucide="trending-up"></i><span>Income</span>
      </button>
      <button class="bottom-nav-btn" data-action="navigateToHistory" id="bnav-history">
        <i data-lucide="history"></i><span>History</span>
      </button>
      <button class="bottom-nav-btn" data-action="navigateToDebt" id="bnav-debt">
        <i data-lucide="hand-coins"></i><span>Debt</span>
      </button>
      <button class="bottom-nav-btn active" aria-current="page" id="bnav-insights">
        <i data-lucide="sparkles"></i><span>Insights</span>
      </button>
    </div>

    <aside class="sidebar">
      <nav class="sidebar-nav">
        <button class="sidebar-btn" data-action="navigateToDashboard" id="snav-dashboard">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </button>
        <button class="sidebar-btn" data-action="navigateToExpense" id="snav-add">
          <i data-lucide="wallet"></i> Expense
        </button>
        <button class="sidebar-btn" data-action="navigateToIncome" id="snav-income">
          <i data-lucide="trending-up"></i> Income
        </button>
        <button class="sidebar-btn" data-action="navigateToHistory" id="snav-history">
          <i data-lucide="history"></i> History
        </button>
        <button class="sidebar-btn" data-action="navigateToDebt" id="snav-debt">
          <i data-lucide="hand-coins"></i> Debt Tracker
        </button>
        <button class="sidebar-btn active" id="snav-insights">
          <i data-lucide="sparkles"></i> AI Insights
        </button>
      </nav>
    </aside>

    <main class="main-content" id="main-content">
      <div class="ins-page">
        <header class="ins-head">
          <h1>Insights</h1>
          <p>Where your money went, worked out on this device.</p>
        </header>

        <div class="seg" id="period-tabs" role="group" aria-label="Period">
          <button type="button" class="seg-btn" data-period="month" aria-pressed="true">This month</button>
          <button type="button" class="seg-btn" data-period="lastMonth" aria-pressed="false">Last month</button>
          <button type="button" class="seg-btn" data-period="quarter" aria-pressed="false">3 months</button>
          <button type="button" class="seg-btn" data-period="year" aria-pressed="false">This year</button>
          <button type="button" class="seg-btn" data-period="custom" aria-pressed="false">Custom</button>
        </div>
        <div class="date-range hidden" id="custom-date-range" role="group" aria-label="Custom dates">
          <label>From <input type="date" id="insights-start-date" /></label>
          <label>To <input type="date" id="insights-end-date" /></label>
        </div>

        <div id="insights-error" class="ins-error hidden" role="alert">
          <i data-lucide="alert-circle"></i>
          <p id="error-message"></p>
          <button type="button" class="icon-btn" data-action="dismissInsightError" aria-label="Dismiss"><i data-lucide="x"></i></button>
        </div>

        <!-- Numbers worked out on the device (insights-v2.js renderGlance); no AI needed -->
        <div id="insights-glance" aria-live="polite" aria-busy="true">
          <section class="home-hero ins-skeleton" aria-label="Adding up your numbers"><span></span><span></span><span></span></section>
        </div>

        <section class="home-section ins-coach" aria-labelledby="coach-title">
          <div class="home-section-head">
            <h2 id="coach-title"><i data-lucide="sparkles"></i> AI coach</h2>
            <button type="button" class="icon-btn hidden" id="new-chat-btn" aria-label="Close conversation" title="Close conversation"><i data-lucide="x"></i></button>
          </div>
          <p class="ins-coach-note" id="coach-note">Ask about the numbers above. Answers are written by AI and can be wrong.</p>
          <div class="chips" id="coach-topics"></div>
          <div id="insights-results" class="hidden"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="offline-indicator" class="offline-indicator hidden" role="alert" aria-live="polite">
    <div class="offline-content">
      <i data-lucide="wifi-off"></i>
      <span>You're offline. <span id="sync-status" class="sync-status hidden">0 pending</span></span>
      <button class="sync-btn" id="sync-btn" title="Sync Now"><i data-lucide="refresh-cw"></i></button>
      <button class="offline-dismiss" aria-label="Dismiss notification" id="offline-dismiss">
        <i data-lucide="x"></i>
      </button>
    </div>
  </div>

  <div id="online-indicator" class="online-indicator hidden" role="alert" aria-live="polite">
    <div class="online-content">
      <i data-lucide="wifi"></i>
      <span>Back online! Syncing your changes...</span>
      <button class="sync-btn" id="sync-btn-online" title="Sync Now"><i data-lucide="refresh-cw"></i></button>
    </div>
  </div>

  <div id="pending-badge-container">
    <span class="offline-queue-badge badge hidden" id="pending-badge" title="Pending transactions to sync">0</span>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="assets/js/utils/currency.js"></script>
  <script src="assets/js/modules/network-status.js"></script>
  <script src="assets/js/modules/offline-queue.js"></script>
  <script type="module" src="assets/js/dashboard.js"></script>
  <script type="module" src="assets/js/modules/insights-v2.js"></script>
  <script src="assets/js/modules/accessibility.js"></script>
  <script type="module">
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
  <script type="module" src="assets/js/modules/reminders.js"></script>
  <script src="assets/js/event-delegation.js"></script>
</body>

</html>
